<!DOCTYPE html>
<html>
<head>
    <title>
        My superhero Card
    </title>
    <style>
        body{
            background-color: darkblue;
            color:white;
            font-family: Arial, Helvetica, sans-serif;
        }
        .hero-name
        {
            font-size: 60px;
            font-weight: bold;
            color: yellow;
            text-shadow: 3px 3px orange;
        }
        .tagline{
            font-style: italic;
            color: lightblue;
            text-transform: capitalize;
        }
        .label{
            text-transform: uppercase;
            text-decoration: underline;
            color: red;
        }
        .weakness{
            text-decoration: line-through;
            color: lightgreen;
        }
        .badge{
            font-size: 40px;
            font-weight: bold;
            color: goldenrod;
            transform: rotate(30deg);
        }
    </style>
</head>
<body>
    <h1 class="hero-name">
        Thunderkid
    </h1>
    <p class="tagline">
        The most powerful hero in the school.
    </p>
    <h2 class="label">
        Superheroes
    </h2>
    <p class="power">
        Can run faster than a cheetah
    </p>
    <p class="power">
        Can lift a school bus
    </p>
    <h2 class="label">
        weakness
    </h2>
    <p class="weakness">
        Math's homework
    </p>
    <p class="weakness">
        Broccoli
    </p>
    <p class="badge">
        Top hero
    </p>
</body>
</html>
