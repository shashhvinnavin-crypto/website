<html>
    <head>
        <title>
            links and tables
        </title>
    </head>
    <body>
        <h1>
     Links and Tables    
        </h1>
        <h2>
            Links
        </h2>
        <p>
            here are the examples of links <a href="https://www.google.com/">google</a> This is google
        </p>
        <h2>
            Listing
        </h2>
        <ol>
        <li>
            first
        </li>
        <li>
            second
        </li>
        </ol>
        <ul>
            <li>
                first
            </li>
            <li>
                second
            </li>
        </ul>
        <dl>
            <dt>
                first
            </dt>
            <dd>
                my first
            </dd>
            <dt>
                second
            </dt>
            <dd>
                my second
            </dd>
        </dl>
        <table border="2">
            <tr>
                <th>
                    first
                </th>
                <th>
                    second
                </th>
            </tr>
            <tr>
                <td>
                    hello
                </td>
                <td>
                    welcome
                </td>
            </tr>
        </table>
    </body>
</html>
