<html>
    <head>
        <title>
            book donation form
        </title>
    </head>
    <body>
        <h1>
        book donation form
        </h1>
        <form>
            <fieldset>
                <legend>
                    Personal details
                </legend>
                <label>
                    Full name
                </label><br>
                <input type="text" id="name" placeholder="enter your name"><br><br>
                <label>
                    Enter your password
                </label><br>
                <input type="password" id="pass" placeholder="enter your password"><br><br>
                <label>
                    Enter your date of birth
                </label><br>
                <input type="date" id="dob">
            </fieldset>
            <br><hr><br>
            <fieldset>
            <legend>
                Other details
            </legend> 
            <label>
                select book genre
            </label><br>
            <select id="book genre">
                <option value="choose">
                    choose a book genre
                </option>
                <option value="horror">
                    horror
                </option>
                <option value="fiction">
                    fiction
                </option>
            </select><br>
            <label>
                Book condition
            </label><br>
            <input type="radio" name="condition" value="brand new">
            brand new<br>
            <input type="radio" name="condition" value="used">
            used<br>
            <label>
                book title
            </label><br>
            <textarea rows="3" cols="25" placeholder="book title">

            </textarea><br>
            <label>
                 drop off day
            </label><br>
            <input type="checkbox" value="today"> today <br>
            <input type="checkbox" value="tommorow"> tommorow <br>
            </fieldset>
            <br>
            <input type="submit" value="donate">

        </form>

        
    </body>
</html>
